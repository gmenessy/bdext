[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-optimizer"
version = "0.1.0"
description = "LLM Prompt Optimization Pipeline MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "diskcache>=5.6.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
prompt-optimizer = "prompt_optimizer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
